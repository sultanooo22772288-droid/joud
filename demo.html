<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نسخة جود التجريبية</title>
<style>
html,body{margin:0;width:100%;height:100%;font-family:Arial,Tahoma,sans-serif;background:#f5f7fb}
body{overflow:hidden}
#demoWrap{display:none;width:100%;height:100%;position:relative;background:#fff}
#demoFrame{border:0;width:100%;height:100%;background:#fff}
#demoBanner{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:20;
  width:min(76vw,560px);box-sizing:border-box;
  background:rgba(20,49,82,.92);color:#fff;border:1px solid rgba(255,255,255,.22);
  border-radius:12px;padding:6px 10px;
  box-shadow:0 8px 20px rgba(10,30,60,.20);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  text-align:center;font-size:12px;line-height:1.45;font-weight:700;
  pointer-events:none
}
#demoBanner .small{font-size:10px;font-weight:500;opacity:.9}
#countdown{display:inline-block;margin-right:4px;color:#ffe08a;font-weight:800}
#expired{display:none;min-height:100%;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:linear-gradient(180deg,#f8fbff,#eef3fa)}
.card{width:min(92vw,520px);background:rgba(255,255,255,.94);border:1px solid #e4e9f1;border-radius:28px;padding:32px 24px;text-align:center;box-shadow:0 18px 55px rgba(31,52,86,.12)}
.icon{width:76px;height:76px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#2e8fe9,#65b7f6);color:#fff;font-size:36px}
h1{margin:0 0 12px;color:#173e68;font-size:27px}
p{margin:0;color:#6f7f91;line-height:1.9;font-size:16px}
.badge{display:inline-block;margin-top:20px;padding:9px 14px;border-radius:999px;background:#fff2f2;color:#d84545;font-weight:700;font-size:14px}
@media(max-width:600px){
  #demoBanner{top:6px;width:72vw;max-width:500px;font-size:10.5px;padding:5px 8px;border-radius:10px;line-height:1.4}
  #demoBanner .small{font-size:9.5px}
}
</style>
</head>
<body>
<div id="demoWrap">
  <div id="demoBanner">
    نسخة تجريبية مؤقتة — تنتهي في 17 سبتمبر 2026 الساعة 10:39 صباحًا بتوقيت عمان
    <div class="small">الوقت المتبقي: <span id="countdown">--</span></div>
  </div>
  <iframe id="demoFrame" src="/" title="منصة جود - ديمو"></iframe>
</div>
<div id="expired">
  <div class="card">
    <div class="icon">✦</div>
    <h1>انتهت مدة النسخة التجريبية</h1>
    <p>هذا الرابط مخصص لعرض منصة جود لمدة يومين فقط.<br>للتفعيل أو طلب نسخة كاملة يرجى التواصل مع إدارة المنصة.</p>
    <div class="badge">نسخة ديمو منتهية</div>
  </div>
</div>
<script>
(function(){
  const expiry=new Date('2026-09-17T06:39:00.000Z').getTime();
  const wrap=document.getElementById('demoWrap');
  const frame=document.getElementById('demoFrame');
  const expired=document.getElementById('expired');
  const countdown=document.getElementById('countdown');

  function formatRemaining(ms){
    if(ms<=0) return 'انتهت المدة';
    const total=Math.floor(ms/1000);
    const days=Math.floor(total/86400);
    const hours=Math.floor((total%86400)/3600);
    const mins=Math.floor((total%3600)/60);
    const secs=total%60;
    return (days?days+' يوم ':'')+hours+' ساعة '+mins+' دقيقة '+secs+' ثانية';
  }

  function apply(){
    const remaining=expiry-Date.now();
    if(remaining<=0){
      wrap.style.display='none';
      frame.src='about:blank';
      expired.style.display='flex';
    }else{
      wrap.style.display='block';
      expired.style.display='none';
      countdown.textContent=formatRemaining(remaining);
    }
  }

  async function registerDemoVisit(){
    try{
      if(localStorage.getItem('joudDemoOwner')==='1') return;
      let visitorId=localStorage.getItem('joudDemoVisitorId')||'';
      if(!visitorId){
        visitorId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():
          ('v_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2));
        localStorage.setItem('joudDemoVisitorId',visitorId);
      }
      await fetch('/api/demo-visits',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'visit',visitor_id:visitorId})
      });
    }catch(e){
      console.warn('تعذر تسجيل زيارة الديمو',e);
    }
  }

  async function markOwnerDevice(){
    const params=new URLSearchParams(location.search);
    if(params.get('owner')!=='JoudOwner_9m4Qx7L2pA6v') return false;

    let visitorId=localStorage.getItem('joudDemoVisitorId')||'';
    localStorage.setItem('joudDemoOwner','1');

    try{
      if(visitorId){
        await fetch('/api/demo-visits',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({action:'exclude-owner',visitor_id:visitorId,owner_token:'JoudOwner_9m4Qx7L2pA6v'})
        });
      }
    }catch(e){
      console.warn('تعذر حذف زيارة المالك السابقة',e);
    }

    history.replaceState({},'',location.pathname);
    return true;
  }

  apply();
  markOwnerDevice().then(isOwner=>{
    if(!isOwner && Date.now()<expiry) registerDemoVisit();
  });
  setInterval(apply,1000);
})();
</script>
</body>
</html>
