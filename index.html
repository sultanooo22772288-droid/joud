<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة نَبْض للتعلّم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f8ff;
      --card:#ffffff;
      --primary:#4f46e5;
      --primary2:#6d5dfc;
      --text:#1f2552;
      --muted:#7a809f;
      --line:#e8eaf5;
      --green:#28b987;
      --orange:#ffb84d;
      --red:#ff6b6b;
      --blue:#54a8ff;
      --purple:#8b6cf5;
      --shadow:0 12px 30px rgba(45,55,110,.09);
      --radius:24px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Tajawal",Arial,sans-serif;
      background:linear-gradient(180deg,#f9fbff 0,#f4f7ff 100%);
      color:var(--text);
    }
    button,input{font:inherit}
    .app{min-height:100vh; display:flex}
    .sidebar{
      width:245px;background:#fff;border-left:1px solid var(--line);
      padding:22px 16px;position:fixed;right:0;top:0;bottom:0;overflow:auto;z-index:20;
    }
    .brand{display:flex;gap:10px;align-items:center;padding:0 8px 20px}
    .brand-logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#4f46e5,#7a6cf6);display:grid;place-items:center;color:#fff;font-size:23px;box-shadow:var(--shadow)}
    .brand h2{font-size:18px;margin:0}.brand small{color:var(--muted)}
    .nav{display:flex;flex-direction:column;gap:6px}
    .nav button{
      border:0;background:transparent;text-align:right;padding:12px 14px;border-radius:15px;
      color:#596081;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.2s;
    }
    .nav button:hover,.nav button.active{background:#f0efff;color:var(--primary);font-weight:700}
    .nav .ico{width:26px;text-align:center;font-size:17px}
    .role-switch{
      margin-top:18px;padding:12px;background:#f8f9ff;border-radius:18px;border:1px solid var(--line)
    }
    .role-switch label{font-size:12px;color:var(--muted)}
    .role-switch select{width:100%;margin-top:7px;padding:10px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--text)}
    .main{margin-right:245px;width:calc(100% - 245px)}
    .topbar{
      height:78px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:15;background:rgba(246,248,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(232,234,245,.7)
    }
    .search{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:14px;min-width:280px;color:var(--muted)}
    .top-actions{display:flex;align-items:center;gap:12px}
    .icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer}
    .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ffd36e,#ff9f6e);display:grid;place-items:center;font-size:23px}
    .content{padding:26px;max-width:1500px;margin:auto}
    .hero{
      background:linear-gradient(120deg,#5d55e7,#7d6ef4);color:#fff;border-radius:28px;padding:28px;
      display:grid;grid-template-columns:1.4fr .6fr;align-items:center;overflow:hidden;position:relative;box-shadow:var(--shadow)
    }
    .hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08);left:-70px;top:-90px}
    .hero h1{margin:0 0 8px;font-size:31px}.hero p{margin:0;color:#e9e7ff}
    .mascot{font-size:92px;text-align:left;filter:drop-shadow(0 10px 8px rgba(0,0,0,.12))}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 14px}
    .section-title h3{margin:0;font-size:19px}.link{color:var(--primary);font-size:13px;cursor:pointer}
    .grid{display:grid;gap:16px}.grid-4{grid-template-columns:repeat(4,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-2{grid-template-columns:repeat(2,1fr)}
    .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
    .stat{display:flex;align-items:center;gap:14px}.stat .bubble{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:23px}
    .stat h4{margin:0;font-size:23px}.stat p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .subject{cursor:pointer;transition:.2s;overflow:hidden}.subject:hover{transform:translateY(-3px)}
    .subject-top{height:105px;border-radius:18px;display:grid;place-items:center;font-size:46px;margin-bottom:12px}
    .subject h4{margin:0}.subject .meta{color:var(--muted);font-size:12px;margin-top:4px}
    .progress{height:9px;background:#edf0f8;border-radius:99px;overflow:hidden;margin-top:12px}.progress span{display:block;height:100%;background:var(--green);border-radius:99px}
    .task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}
    .task .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#f1f0ff}
    .task strong{font-size:14px}.task small{display:block;color:var(--muted);margin-top:3px}.task .tag{margin-right:auto;padding:7px 10px;border-radius:11px;font-size:11px}
    .tag.orange{background:#fff2df;color:#b87100}.tag.red{background:#ffe8e8;color:#c64343}.tag.green{background:#e8fff5;color:#148b67}.tag.blue{background:#eaf4ff;color:#347ac3}
    .chart{height:180px;display:flex;align-items:flex-end;gap:12px;padding-top:20px}
    .bar{flex:1;background:linear-gradient(180deg,#8b7cff,#5e54e7);border-radius:12px 12px 4px 4px;min-height:20px;position:relative}
    .bar span{position:absolute;bottom:-24px;width:100%;text-align:center;font-size:11px;color:var(--muted)}
    .badge-wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .badge{text-align:center;padding:14px 8px;border-radius:18px;background:#fbfbff;border:1px solid var(--line)}
    .badge .bicon{font-size:38px}.badge p{margin:7px 0 0;font-size:12px;font-weight:700}
    .page{display:none}.page.active{display:block}
    .page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.page-head h2{margin:0}.page-head p{color:var(--muted);margin:4px 0 0}
    .btn{border:0;border-radius:13px;padding:11px 16px;cursor:pointer}.btn.primary{background:var(--primary);color:white}.btn.soft{background:#f0efff;color:var(--primary)}
    .lesson-item{display:flex;align-items:center;gap:14px;padding:15px;border:1px solid var(--line);border-radius:18px;margin-bottom:10px;background:#fff}
    .lesson-num{width:40px;height:40px;border-radius:12px;background:#efefff;display:grid;place-items:center;color:var(--primary);font-weight:800}
    .lesson-item small{color:var(--muted)}.lesson-item button{margin-right:auto}
    .schedule{overflow:auto}.schedule table{width:100%;border-collapse:separate;border-spacing:8px}.schedule th{font-size:12px;color:var(--muted);padding:8px}.schedule td{min-width:125px;background:#f8f9ff;border-radius:14px;padding:14px;text-align:center;font-size:13px}
    .ai-box{max-width:900px;margin:auto}.chat{height:430px;overflow:auto;padding:10px}.msg{max-width:76%;padding:12px 15px;border-radius:18px;margin:10px 0;line-height:1.7}.msg.bot{background:#f0efff}.msg.user{background:#4f46e5;color:#fff;margin-right:auto}
    .chat-input{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:14px}.chat-input input{flex:1;border:1px solid var(--line);padding:13px;border-radius:14px}
    .login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#eef3ff,#f9f5ff);z-index:100;display:grid;place-items:center;padding:20px}
    .login-card{width:min(920px,100%);display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:30px;overflow:hidden;box-shadow:0 30px 80px rgba(49,54,110,.18)}
    .login-visual{background:linear-gradient(135deg,#554be1,#816df6);color:#fff;padding:45px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
    .login-visual .kid{font-size:110px}.login-form{padding:45px}.login-form h1{margin:0 0 8px}.login-form p{color:var(--muted)}
    .field{margin:16px 0}.field label{display:block;font-size:13px;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px}
    .login-form .btn{width:100%;padding:14px;margin-top:8px}
    .demo-note{font-size:12px;background:#f7f8ff;border:1px dashed #cfd3f3;padding:10px;border-radius:12px;color:var(--muted);margin-top:14px}
    .mobile-nav{display:none}

    .teacher-tool{border:1px dashed #cfd3f3;background:#fafaff;border-radius:20px;padding:18px;margin-bottom:16px}
    .teacher-tool h3{margin-top:0}
    .upload-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .upload-row input,.upload-row textarea,.upload-row select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}
    .readonly-note{background:#eef8ff;border:1px solid #cfe8ff;color:#376b98;padding:12px 14px;border-radius:14px;margin-bottom:16px}
    @media(max-width:1050px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){
      .sidebar{display:none}.main{margin-right:0;width:100%}.topbar{padding:0 14px}.search{min-width:0;width:180px}
      .content{padding:16px 14px 84px}.hero{grid-template-columns:1fr}.mascot{font-size:70px;text-align:center}
      .grid-4,.grid-3,.grid-2,.upload-row{grid-template-columns:1fr}.badge-wrap{grid-template-columns:repeat(2,1fr)}
      .login-card{grid-template-columns:1fr}.login-visual{padding:25px}.login-visual .kid{font-size:70px}.login-form{padding:26px}
      .mobile-nav{display:flex;position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);z-index:30;justify-content:space-around;padding:8px}
      .mobile-nav button{border:0;background:transparent;font-size:20px;color:#6c7292}.mobile-nav button span{display:block;font-size:9px;margin-top:4px}
    }
  
    @media(max-width:1050px){
      #teacherGradeChecks{grid-template-columns:repeat(2,minmax(180px,1fr)) !important}
    }
    @media(max-width:760px){
      #teacherGradeChecks{grid-template-columns:1fr !important}
    }


    .submission-lists{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .submission-lists details{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
    .submission-lists summary{cursor:pointer;padding:11px 13px;font-weight:700;list-style:none}
    .submission-lists summary::-webkit-details-marker{display:none}
    .submission-lists ul{margin:0;padding:0 28px 12px 12px;color:var(--text)}
    .submission-lists li{margin:7px 0}
    .homework-demo-card{padding:14px 0;border-bottom:1px solid var(--line)}
    .homework-demo-card:last-child{border-bottom:0}
    @media(max-width:760px){.submission-lists{grid-template-columns:1fr}}

    .locked-field{background:#f6f8fb!important;color:#687386!important;cursor:not-allowed;border-style:dashed!important}
    .student-profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .student-profile-grid .full{grid-column:1/-1}
    .academic-info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
    .academic-box{padding:13px;border:1px solid var(--line);border-radius:14px;background:#f8fbff}
    .academic-box small{display:block;color:var(--muted);margin-bottom:5px}
    .save-status{margin-top:10px;font-size:13px;font-weight:700}
    @media(max-width:760px){.student-profile-grid,.academic-info{grid-template-columns:1fr}.student-profile-grid .full{grid-column:auto}}


    /* ===== منصة نبض: نظام الثيمات ===== */
    body{
      --theme-accent:var(--primary);
      --theme-soft:#f0efff;
      --theme-deco:"✦";
      --theme-pattern:none;
    }
    body[data-theme="teacher"]{
      --bg:#fffaf0;--card:#fffdf8;--primary:#a56a15;--primary2:#d49a34;
      --text:#3d3021;--muted:#85745f;--line:#efe0c8;--theme-soft:#fff1d5;
      --theme-deco:"✏️";--shadow:0 12px 30px rgba(126,86,24,.10);
      background:linear-gradient(180deg,#fffaf0 0,#fff4dc 100%);
    }
    body[data-theme="tree"]{
      --bg:#f3fbf4;--card:#fbfffb;--primary:#2f7d4a;--primary2:#63a868;
      --text:#23452d;--muted:#6d856f;--line:#dbeadd;--theme-soft:#e4f5e6;
      --theme-deco:"🌿";--shadow:0 12px 30px rgba(38,105,63,.10);
      background:linear-gradient(180deg,#f5fcf5 0,#eaf7ec 100%);
    }
    body[data-theme="national"]{
      --bg:#f7faf7;--card:#ffffff;--primary:#b3182b;--primary2:#1f7a4d;
      --text:#25372c;--muted:#718078;--line:#dfe7e1;--theme-soft:#fce8ea;
      --theme-deco:"🇴🇲";--shadow:0 12px 30px rgba(118,20,34,.10);
      background:linear-gradient(180deg,#ffffff 0,#f2f8f3 58%,#fff1f2 100%);
    }
    body[data-theme="sports"]{
      --bg:#f2f9ff;--card:#ffffff;--primary:#0968c7;--primary2:#18a57a;
      --text:#153956;--muted:#6d8498;--line:#d9e9f4;--theme-soft:#e4f3ff;
      --theme-deco:"🏅";--shadow:0 12px 30px rgba(8,94,164,.10);
      background:linear-gradient(180deg,#f1f9ff 0,#eafaf5 100%);
    }
    body[data-theme="ramadan"]{
      --bg:#f8f5ff;--card:#fffefe;--primary:#6741a5;--primary2:#c69b36;
      --text:#34264b;--muted:#80738e;--line:#e7def1;--theme-soft:#eee6fb;
      --theme-deco:"🌙";--shadow:0 12px 30px rgba(88,55,141,.11);
      background:linear-gradient(180deg,#f9f5ff 0,#fff9e8 100%);
    }
    body[data-theme="backtoschool"]{
      --bg:#f5f9ff;--card:#ffffff;--primary:#3867d6;--primary2:#f0932b;
      --text:#243b60;--muted:#728099;--line:#dfe7f3;--theme-soft:#e8f0ff;
      --theme-deco:"🎒";--shadow:0 12px 30px rgba(40,82,155,.10);
      background:linear-gradient(180deg,#f7faff 0,#fff8ed 100%);
    }
    body[data-theme="children"]{
      --bg:#fff8fc;--card:#ffffff;--primary:#d94c93;--primary2:#6e72d9;
      --text:#49304a;--muted:#8b7388;--line:#f0dfeb;--theme-soft:#fdeaf5;
      --theme-deco:"🎈";--shadow:0 12px 30px rgba(169,63,121,.10);
      background:linear-gradient(180deg,#fff8fc 0,#f4f2ff 100%);
    }
    body[data-theme="book"]{
      --bg:#f8f6f1;--card:#fffefb;--primary:#795548;--primary2:#b58b5c;
      --text:#3e342f;--muted:#82766f;--line:#e9e0d7;--theme-soft:#f3ebe2;
      --theme-deco:"📚";--shadow:0 12px 30px rgba(94,70,57,.10);
      background:linear-gradient(180deg,#faf8f4 0,#f1ece5 100%);
    }
    body[data-theme]:not([data-theme="default"]) .sidebar{
      background:color-mix(in srgb,var(--card) 94%,var(--primary) 6%);
    }
    body[data-theme]:not([data-theme="default"]) .topbar{
      background:color-mix(in srgb,var(--bg) 88%,transparent);
    }
    body[data-theme]:not([data-theme="default"]) .brand-logo{
      background:linear-gradient(135deg,var(--primary),var(--primary2));
    }
    body[data-theme]:not([data-theme="default"]) .nav button:hover,
    body[data-theme]:not([data-theme="default"]) .nav button.active{
      background:var(--theme-soft);color:var(--primary);
    }
    body[data-theme]:not([data-theme="default"]) .btn.primary{
      background:linear-gradient(135deg,var(--primary),var(--primary2));
    }
    body[data-theme]:not([data-theme="default"]) .hero{
      background:
        radial-gradient(circle at 10% 20%,color-mix(in srgb,var(--primary2) 16%,transparent),transparent 34%),
        linear-gradient(135deg,color-mix(in srgb,var(--theme-soft) 85%,#fff),var(--card));
      border:1px solid var(--line);
    }
    body[data-theme]:not([data-theme="default"]) .hero::after{
      content:var(--theme-deco);
      position:absolute;left:34px;bottom:14px;font-size:54px;opacity:.18;pointer-events:none;
    }
    body[data-theme]:not([data-theme="default"]) .hero{position:relative;overflow:hidden}
    body[data-theme]:not([data-theme="default"]) .progress span,
    body[data-theme]:not([data-theme="default"]) .bar{
      background:linear-gradient(180deg,var(--primary2),var(--primary));
    }
    .theme-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
    .theme-card{
      position:relative;overflow:hidden;border:2px solid transparent;border-radius:22px;
      padding:18px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:.2s;
      min-height:180px;display:flex;flex-direction:column;justify-content:space-between
    }
    .theme-card:hover{transform:translateY(-3px)}
    .theme-card.active{border-color:var(--primary)}
    .theme-card .theme-icon{font-size:38px}
    .theme-card h3{margin:10px 0 5px}
    .theme-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
    .theme-palette{display:flex;gap:6px;margin-top:14px}
    .theme-palette span{width:25px;height:8px;border-radius:99px}
    .theme-selected{
      position:absolute;left:12px;top:12px;background:var(--primary);color:#fff;
      border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800
    }
    .occasion-banner{
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:16px 18px;border:1px solid var(--line);border-radius:20px;
      background:linear-gradient(135deg,var(--theme-soft),var(--card));margin-bottom:18px
    }
    .occasion-banner .big{font-size:34px}
    @media(max-width:1100px){.theme-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:650px){.theme-grid{grid-template-columns:1fr}}




    /* ===== تحسين بصري للروضة حتى الصف الرابع ===== */
    .card,.lesson-item,.academic-box,.schedule td,.submission-lists details{border-radius:22px}
    .btn,.icon-btn,.field input,.upload-row input,.upload-row textarea,.upload-row select,.search{border-radius:16px}
    .nav button{border-radius:16px;margin:3px 0;transition:transform .18s ease,background .18s ease}
    .nav button:hover{transform:translateX(-3px)}
    .card{transition:transform .18s ease,box-shadow .18s ease}
    .card:hover{transform:translateY(-2px)}
    .page-head h2,.section-title h3{letter-spacing:.1px}
    .hero{border-radius:30px}
    .hero h1{font-size:clamp(25px,3vw,36px)}
    .stat{position:relative;overflow:hidden}
    .stat::after{content:"★";position:absolute;left:12px;top:8px;font-size:22px;opacity:.08;color:var(--primary)}
    .subject{border-top:4px solid color-mix(in srgb,var(--primary) 55%,#fff)}
    .theme-card{border-radius:28px;min-height:195px}
    .theme-card .theme-icon{width:62px;height:62px;display:grid;place-items:center;border-radius:20px;background:var(--theme-soft)}

    body[data-theme="rainbow"]{--bg:#fffaf3;--card:#fff;--primary:#ff6b6b;--primary2:#5f9cff;--text:#34405b;--muted:#78849b;--line:#f1e5d9;--theme-soft:#fff0df;--theme-deco:"🌈";--shadow:0 14px 32px rgba(89,96,160,.11);background:linear-gradient(145deg,#fff8ed,#f3fbff 52%,#fff2fa)}
    body[data-theme="space"]{--bg:#f5f4ff;--card:#fff;--primary:#6757d9;--primary2:#3ba7d8;--text:#2f3158;--muted:#777a9c;--line:#e4e2f5;--theme-soft:#eceaff;--theme-deco:"🚀";--shadow:0 14px 34px rgba(74,66,151,.12);background:radial-gradient(circle at 15% 12%,#e8e4ff,transparent 28%),linear-gradient(180deg,#f8f7ff,#eef8ff)}
    body[data-theme="garden"]{--bg:#f4fcf6;--card:#fff;--primary:#42a56b;--primary2:#f2a94a;--text:#315342;--muted:#74897b;--line:#dceee2;--theme-soft:#e7f8ec;--theme-deco:"🦋";--shadow:0 14px 32px rgba(61,126,81,.10);background:linear-gradient(180deg,#f7fff8,#fffaf0)}
    body[data-theme="ocean"]{--bg:#f1fbff;--card:#fff;--primary:#278fc5;--primary2:#39b8a7;--text:#28506a;--muted:#718b9a;--line:#d8edf4;--theme-soft:#e1f7ff;--theme-deco:"🐳";--shadow:0 14px 32px rgba(34,126,161,.11);background:linear-gradient(180deg,#f2fcff,#edf9f6)}

    /* ===== العيد الوطني العُماني ===== */
    body[data-theme="national"]{
      --bg:#f7faf8;
      --card:#ffffff;
      --primary:#d22630;
      --primary2:#007a3d;
      --text:#20362a;
      --muted:#6f7f76;
      --line:#dbe5df;
      --theme-soft:#fff0f1;
      --theme-deco:"🇴🇲";
      --shadow:0 12px 30px rgba(70,36,39,.10);
      background:
        linear-gradient(180deg,#ffffff 0 33%,#f5f8f6 33% 66%,#fdf1f2 66% 100%);
    }
    body[data-theme="national"] .sidebar{
      border-left:4px solid #d22630;
      background:
        linear-gradient(180deg,#ffffff 0 72%,rgba(0,122,61,.06) 100%);
    }
    body[data-theme="national"] .topbar{
      background:rgba(255,255,255,.92);

/* ===== شريط إعلانات المدرسة ===== */
.announcement-ticker{
  position:sticky;
  top:0;
  z-index:19;
  min-height:42px;
  display:flex;
  align-items:center;
  gap:0;
  background:linear-gradient(90deg,var(--primary),var(--primary2));
  color:#fff;
  overflow:hidden;
  border-bottom:1px solid rgba(255,255,255,.18);
}
.announcement-label{
  flex:0 0 auto;
  min-height:42px;
  display:flex;
  align-items:center;
  padding:0 16px;
  font-size:12px;
  font-weight:900;
  background:rgba(0,0,0,.14);
  white-space:nowrap;
  position:relative;
  z-index:2;
}
.announcement-track-wrap{
  flex:1;
  overflow:hidden;
  min-width:0;
}
.announcement-track{
  display:inline-flex;
  align-items:center;
  gap:44px;
  white-space:nowrap;
  min-width:max-content;
  padding-inline:24px;
  font-size:13px;
  font-weight:800;
  animation:nabdTickerMove 28s linear infinite;
}
.announcement-track:hover{animation-play-state:paused}
.announcement-item{
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.announcement-item::before{
  content:"●";
  font-size:7px;
  opacity:.75;
}
.announcement-empty{
  opacity:.9;
  font-weight:700;
}
@keyframes nabdTickerMove{
  from{transform:translateX(-5%)}
  to{transform:translateX(100%)}
}
@media (prefers-reduced-motion:reduce){
  .announcement-track{animation:none;white-space:normal;min-width:0;padding:8px 14px}
}
.announcement-admin-grid{
  display:grid;
  grid-template-columns:1.4fr .7fr auto;
  gap:10px;
  align-items:end;
}
.announcement-admin-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:14px;
}
.announcement-admin-row{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:10px;
  align-items:center;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--card);
}
.announcement-admin-row .announcement-text{
  min-width:0;
  overflow-wrap:anywhere;
}
.announcement-admin-row small{
  display:block;
  color:var(--muted);
  margin-top:3px;
}
@media(max-width:760px){
  .announcement-label{padding:0 9px;font-size:10px}
  .announcement-track{font-size:11px;gap:24px}
  .announcement-admin-grid{grid-template-columns:1fr}
  .announcement-admin-row{grid-template-columns:1fr}
}

function formatAnnouncementDate(value){
  if(!value) return '';
  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return '';
  return d.toLocaleString('ar-OM',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function addSchoolAnnouncement(){
  if(role!=='admin'){alert('إضافة الإعلانات متاحة للإدارة فقط.');return;}
  const input=document.getElementById('newSchoolAnnouncement');
  const status=document.getElementById('newSchoolAnnouncementStatus')?.value||'active';
  const value=(input?.value||'').trim();
  if(!value){alert('اكتب نص الإعلان أولاً.');input?.focus();return;}
  const list=getSchoolAnnouncements();
  list.push({id:Date.now(),text:value,active:status==='active',createdAt:new Date().toISOString()});
  saveSchoolAnnouncements(list);
  renderAnnouncementTicker();
  renderAnnouncementsAdmin();
}
function toggleSchoolAnnouncement(id){
  if(role!=='admin') return;
  const list=getSchoolAnnouncements();
  const item=list.find(x=>x.id===id);
  if(!item) return;
  item.active=item.active===false;
  saveSchoolAnnouncements(list);
  renderAnnouncementTicker();
  renderAnnouncementsAdmin();
}
function deleteSchoolAnnouncement(id){
  if(role!=='admin') return;
  if(!confirm('هل تريد حذف هذا الإعلان؟')) return;
  const list=getSchoolAnnouncements().filter(x=>x.id!==id);
  saveSchoolAnnouncements(list);
  renderAnnouncementTicker();
  renderAnnouncementsAdmin();
}

function loadRememberedLogin(){
  try{
    const saved=JSON.parse(localStorage.getItem('nabdRememberedLogin')||'null');
    if(!saved) return;
    const email=document.getElementById('loginEmail');
    const password=document.getElementById('loginPassword');
    const remember=document.getElementById('rememberLogin');
    if(email) email.value=saved.email||'';
    if(password) password.value=saved.password||'';
    if(remember) remember.checked=true;
  }catch(e){}
}

function saveRememberedLogin(email,password){
  const remember=document.getElementById('rememberLogin');
  if(remember?.checked){
    localStorage.setItem('nabdRememberedLogin',JSON.stringify({email,password}));
  }else{
    localStorage.removeItem('nabdRememberedLogin');
  }
}

async function syncCloudProfiles(){
  const profiles=await NabdCloud.loadProfiles();
  const students=profiles.filter(x=>x.role==='student');
  const teachers=profiles.filter(x=>x.role==='teacher');
  const admin=profiles.find(x=>x.role==='admin');
  if(role==='admin'){
    let credentials=[];
    try{credentials=await NabdCloud.loadAdminCredentials();}catch(e){console.warn('تعذر تحميل كلمات المرور الإدارية',e);}
    const byId=new Map((credentials||[]).map(c=>[String(c.auth_user_id||''),c]));
    demoData.students=students.map(s=>({...s,password:byId.get(String(s.authUserId||''))?.password||'',email:byId.get(String(s.authUserId||''))?.email||s.email}));
    demoData.teachers=teachers.map(t=>({...t,password:byId.get(String(t.authUserId||''))?.password||'',email:byId.get(String(t.authUserId||''))?.email||t.email}));
    if(admin) demoData.admin={...demoData.admin,...admin,password:''};
  }else if(role==='student'){
    const me=students.find(x=>String(x.email||'').toLowerCase()===String(currentLoginEmail||'').toLowerCase());
    demoData.students=me?[me]:[];
  }else if(role==='teacher'){
    const me=teachers.find(x=>String(x.email||'').toLowerCase()===String(currentLoginEmail||'').toLowerCase());
    demoData.teachers=me?[me]:[];
  }
}

async function enterDemo(){
  const enteredEmail=(document.getElementById('loginEmail')?.value||'').trim().toLowerCase();
  const enteredPassword=(document.getElementById('loginPassword')?.value||'').trim();
  if(!enteredEmail || !enteredPassword){ alert('يرجى إدخال البريد الإلكتروني وكلمة المرور.'); return; }
  const btn=document.querySelector('.login-main-btn');
  const oldText=btn?.textContent;
  if(btn){btn.disabled=true;btn.textContent='جاري تسجيل الدخول...';}
  try{
    const result=await NabdCloud.signIn(enteredEmail,enteredPassword);
    role=result.profile.role;
    currentLoginEmail=enteredEmail;
    saveRememberedLogin(enteredEmail,enteredPassword);
    await syncCloudProfiles();
    registerVisitorLogin(role);
    document.getElementById('login').style.display='none';
    renderNav(); renderDashboard(); renderRolePages(); renderAdminManagement(); updateVisitorCounter(); showPage('dashboard');
  }catch(e){
    console.error(e);
    alert('تعذر تسجيل الدخول: '+(e.message||'تحقق من البريد الإلكتروني وكلمة المرور وإعدادات Supabase.'));
  }finally{
    if(btn){btn.disabled=false;btn.textContent=oldText||'تسجيل الدخول';}
  }
}

  return [

function parseTeacherScheduleCell(value){
  const v=String(value||'').trim();
  if(!v || v==='—') return {grade:'',section:''};
  const match=v.match(/^(.*?)\s*\(([أبجد])\)\s*$/);
  if(match) return {grade:match[1].trim(),section:match[2]};
  return {grade:v,section:''};
}

function toggleTeacherScheduleSection(gradeSelect){
  const r=gradeSelect?.dataset?.tsGradeR;
  const c=gradeSelect?.dataset?.tsGradeC;
  const section=document.querySelector(`[data-ts-section-r="${r}"][data-ts-section-c="${c}"]`);
  if(!section) return;
  if(gradeSelect.value){
    section.style.display='';
    section.disabled=false;
  }else{
    section.value='';
    section.style.display='none';
    section.disabled=true;
  }
}

function saveTeacherScheduleAdmin(){
  if(role!=='admin') return;
  const teacherId=document.getElementById('teacherScheduleAdminSelect')?.value||'';
  const teacher=demoData.teachers.find(t=>String(t.id)===String(teacherId));
  if(!teacher){ alert('اختر المعلم أولاً.'); return; }
  const rows=[];
  for(let r=0;r<5;r++){
    const timeEl=document.querySelector(`[data-ts-time="${r}"]`);
    const row=[(timeEl?.value||'—').trim()||'—'];
    for(let c=1;c<6;c++){
      const grade=document.querySelector(`[data-ts-grade-r="${r}"][data-ts-grade-c="${c}"]`)?.value||'';
      const section=document.querySelector(`[data-ts-section-r="${r}"][data-ts-section-c="${c}"]`)?.value||'';
      if(!grade){ row.push('—'); }
      else if(section){ row.push(`${grade} (${section})`); }
      else { row.push(grade); }
    }
    rows.push(row);
  }
  demoData.teacherSchedules=demoData.teacherSchedules||{};
  demoData.teacherSchedules[String(teacher.id)]={teacherId:teacher.id,teacherName:teacher.name,rows,updatedAt:new Date().toISOString()};

async function saveAdminProfileChanges(){
  if(role!=='admin')return;
  const email=(document.getElementById('adminProfileEmail')?.value||'').trim().toLowerCase();
  const password=(document.getElementById('adminProfilePassword')?.value||'').trim();
  const status=document.getElementById('adminProfileSaveStatus');
  if(!email || !password){if(status){status.style.color='#c0392b';status.textContent='يرجى إدخال البريد الإلكتروني وكلمة المرور الجديدة.';}return;}
  try{
    const c=await NabdCloud.init();
    const {data:u,error:ae}=await c.auth.updateUser({email,password}); if(ae)throw ae;
    const {error:pe}=await c.from('profiles').update({email}).eq('auth_user_id',u.user.id); if(pe)throw pe;
    currentLoginEmail=email;
    if(status){status.style.color='#178a5b';status.textContent='✓ تم تحديث بيانات الإدارة السحابية.';}
  }catch(e){if(status){status.style.color='#c0392b';status.textContent='تعذر التحديث: '+(e.message||'');}}
}

async function saveStudentProfileChanges(){
  if(role!=='student')return;
  const s=getCurrentStudent(); if(!s){alert('تعذر العثور على سجل الطالب.');return;}
  const email=(document.getElementById('studentProfileEmail')?.value||'').trim().toLowerCase();
  const password=(document.getElementById('studentProfilePassword')?.value||'').trim();
  const status=document.getElementById('studentProfileSaveStatus');
  if(!email || !password){if(status){status.style.color='#c0392b';status.textContent='يرجى إدخال البريد الإلكتروني وكلمة المرور الجديدة.';}return;}
  try{
    const c=await NabdCloud.init();
    const {error:ae}=await c.auth.updateUser({email,password}); if(ae)throw ae;
    const {error:pe}=await c.from('profiles').update({email}).eq('auth_user_id',s.authUserId); if(pe)throw pe;
    await NabdCloud.syncOwnCredential(email,password);
    s.email=email; s.password=password; currentLoginEmail=email; renderProfilePageForRole();
    const st=document.getElementById('studentProfileSaveStatus');if(st){st.style.color='#178a5b';st.textContent='✓ تم تحديث بيانات الدخول السحابية.';}
  }catch(e){if(status){status.style.color='#c0392b';status.textContent='تعذر التحديث: '+(e.message||'');}}
}

async function renderTeacherReportStudents(){
  const grade=document.getElementById('reportGrade')?.value || '';
  const section=document.getElementById('reportSection')?.value || '';
  const target=document.getElementById('teacherReportStudents');
  if(!target) return;
  if(!grade || !section){
    target.innerHTML='<div style="text-align:center;color:var(--muted);padding:20px">اختر الصف والشعبة لعرض أسماء الطلاب.</div>';
    return;
  }

  target.innerHTML='<div style="text-align:center;color:var(--muted);padding:20px">جاري تحميل الطلاب المسجلين...</div>';
  try{
    const profiles=await NabdCloud.loadProfiles();
    const students=profiles.filter(s=>s.role==='student' && s.grade===grade && s.section===section);

    if(!students.length){
      target.innerHTML=`<div style="text-align:center;color:var(--muted);padding:20px">لا يوجد طلاب مسجلون في ${esc(grade)} — الشعبة (${esc(section)}).</div>`;
      return;
    }

    const teacher=demoData.teachers.find(x=>String(x.email||'').toLowerCase()===String(currentLoginEmail||'').toLowerCase())||demoData.teachers[0]||{};
    const subject=teacher.subject||'غير محدد';

    const cards=[];
    for(let i=0;i<students.length;i++){
      const s=students[i];
      let existing=null;
      try{ existing=await NabdCloud.getTeacherStudentReport(s.authUserId,subject); }catch(e){}
      const saved=existing?.report_text||'';
      const updated=existing?.updated_at||'';
      cards.push(`<div style="padding:14px 0;border-bottom:${i===students.length-1?'0':'1px solid var(--line)'};position:relative">
        ${updated?`<div style="position:absolute;left:10px;top:10px;opacity:.55;font-size:11px;font-weight:700">آخر تعديل: ${formatSchoolDateTime(updated)}</div>`:''}
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:9px">
          <div>
            <strong>${esc(s.name)}</strong>
            <small style="display:block;color:var(--muted);margin-top:3px">${esc(grade)} • الشعبة (${esc(section)}) • ${esc(subject)}</small>
          </div>
          <button class="btn primary" onclick="saveTeacherStudentReportCloud('${encodeURIComponent(s.authUserId)}','${encodeURIComponent(s.name)}','${encodeURIComponent(subject)}','${encodeURIComponent(grade)}','${encodeURIComponent(section)}','report_${i}')">حفظ وإرسال للطالب</button>
        </div>
        <textarea id="report_${i}" rows="4" placeholder="اكتب تقريرًا وصفيًا عن الطالب..." style="width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;resize:vertical">${esc(saved)}</textarea>
      </div>`);
    }
    target.innerHTML=cards.join('');
  }catch(e){
    target.innerHTML='<div style="color:#c0392b;padding:18px">تعذر تحميل الطلاب: '+esc(e.message||'')+'</div>';
  }
}

async function saveTeacherStudentReportCloud(studentAuthIdEnc,studentNameEnc,subjectEnc,gradeEnc,sectionEnc,textareaId){
  const el=document.getElementById(textareaId);
  if(!el)return;
  const report=el.value.trim();
  if(!report){alert('اكتب التقرير أولاً.');return;}
  try{
    await NabdCloud.saveStudentReport({
      student_auth_id:decodeURIComponent(studentAuthIdEnc),
      student_name:decodeURIComponent(studentNameEnc),
      subject:decodeURIComponent(subjectEnc),
      grade:decodeURIComponent(gradeEnc),
      section:decodeURIComponent(sectionEnc),
      report_text:report
    });
    alert('تم حفظ التقرير وإرساله إلى حساب الطالب مباشرة.');
    await renderTeacherReportStudents();
  }catch(e){
    alert('تعذر حفظ التقرير: '+(e.message||''));
  }
}

function parsePublishedClassLabel(cls){
  const raw=String(cls||'').trim();
  const parts=raw.split('/').map(x=>x.trim());
  const grade=parts[0]||'غير محدد';
  const section=parts[1]||'—';
  // في هيكل المنصة الحالي اسم المرحلة يطابق المستوى الدراسي المستخدم في إدارة المدرسة.
  const stage=grade;
  return {stage,grade,section};
}

function getPublishedSchoolContent(){
  let data={homeworks:[],quizzes:[]};
  try{
    const saved=JSON.parse(localStorage.getItem('nabdPublishedSchoolContent')||'null');
    if(saved) data={homeworks:saved.homeworks||[],quizzes:saved.quizzes||[]};
  }catch(e){}

  if(!data.homeworks.length && !data.quizzes.length){
    data={
      homeworks:[
        {id:1,title:'واجب المعادلات',teacher:'خالد سالم',stage:'الصف الأول',grade:'الصف الأول',section:'أ',
         publishedAt:'2026-08-10T09:00',dueAt:'2026-08-15T20:00'},
        {id:2,title:'ورقة عمل العلوم',teacher:'محمد علي',stage:'الصف الثاني',grade:'الصف الثاني',section:'ب',
         publishedAt:'2026-08-01T08:30',dueAt:'2026-08-08T18:00'}
      ],
      quizzes:[
        {id:1,title:'اختبار العلوم',teacher:'محمد علي',stage:'الصف الثاني',grade:'الصف الثاني',section:'ب',
         questions:'20',publishedAt:'2026-08-10T10:00',scheduledAt:'2026-08-16T09:00'},
        {id:2,title:'اختبار الرياضيات',teacher:'خالد سالم',stage:'الصف الأول',grade:'الصف الأول',section:'أ',
         questions:'10',publishedAt:'2026-08-01T10:00',scheduledAt:'2026-08-07T08:00'}
      ]
    };
    try{localStorage.setItem('nabdPublishedSchoolContent',JSON.stringify(data));}catch(e){}
  }

  // ترقية العناصر القديمة التي لم يكن لديها موعد.
  let changed=false;
  data.homeworks.forEach((x,i)=>{
    if(!x.publishedAt || x.publishedAt==='منشور'){ x.publishedAt=new Date(Date.now()-(i+1)*86400000).toISOString(); changed=true; }
    if(!x.dueAt){ x.dueAt=new Date(Date.now()+(i===0?3:-2)*86400000).toISOString(); changed=true; }
  });
  data.quizzes.forEach((x,i)=>{
    if(!x.publishedAt || x.publishedAt==='منشور'){ x.publishedAt=new Date(Date.now()-(i+1)*86400000).toISOString(); changed=true; }
    if(!x.scheduledAt){ x.scheduledAt=new Date(Date.now()+(i===0?3:-2)*86400000).toISOString(); changed=true; }
  });
  if(changed) savePublishedSchoolContent(data);
  return data;
}

function savePublishedSchoolContent(data){
  try{localStorage.setItem('nabdPublishedSchoolContent',JSON.stringify(data));}catch(e){}
}

function formatSchoolDateTime(value){
  if(!value) return '—';
  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return '—';
  return d.toLocaleString('ar-OM',{
    year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit'
  });
}

  if(type==='quiz'){
    const t=new Date(item.scheduledAt||item.publishedAt).getTime();
    return t>now ? {key:'upcoming',label:'قادم',cls:'blue'} : {key:'ended',label:'منتهي',cls:'red'};
  }
  const due=new Date(item.dueAt||item.publishedAt).getTime();
  const published=new Date(item.publishedAt).getTime();
  if(published>now) return {key:'upcoming',label:'قادم',cls:'blue'};
  if(due<now) return {key:'ended',label:'منتهي',cls:'red'};
  return {key:'active',label:'نشط حاليًا',cls:'green'};
}

let homeworkQuestionDraft=[];

function toggleHomeworkModeBuilder(){
  const mode=document.getElementById('hwMode')?.value||'online';
  const online=document.getElementById('hwOnlineBuilder');
  const file=document.getElementById('hwFileBuilder');
  if(online) online.style.display=mode==='online'?'block':'none';
  if(file) file.style.display=mode==='file'?'block':'none';
  if(mode==='online' && !homeworkQuestionDraft.length) addHomeworkQuestion('mcq');
}

function addHomeworkQuestion(type){
  homeworkQuestionDraft.push({
    id:'q_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    type:type==='essay'?'essay':'mcq',
    text:'',
    options:type==='essay'?[]:['','','',''],
    correct:type==='essay'?'':0,
    points:1
  });
  renderHomeworkQuestionBuilder();
}

function removeHomeworkQuestion(id){
  homeworkQuestionDraft=homeworkQuestionDraft.filter(q=>q.id!==id);
  renderHomeworkQuestionBuilder();
}

function updateHomeworkQuestion(id,field,value,index=null){
  const q=homeworkQuestionDraft.find(x=>x.id===id); if(!q)return;
  if(field==='option' && index!==null) q.options[index]=value;
  else if(field==='correct') q.correct=Number(value);
  else if(field==='points') q.points=Math.max(1,Number(value)||1);
  else q[field]=value;
}

function renderHomeworkQuestionBuilder(){
  const box=document.getElementById('hwQuestionBuilder'); if(!box)return;
  if(!homeworkQuestionDraft.length){
    box.innerHTML='<div style="padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center">اضغط إضافة سؤال للبدء.</div>';
    return;
  }
  box.innerHTML=homeworkQuestionDraft.map((q,i)=>`
    <div style="border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:#fff">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px">
        <strong>السؤال ${i+1} — ${q.type==='mcq'?'اختيار متعدد':'مقالي'}</strong>
        <button type="button" class="btn soft" onclick="removeHomeworkQuestion('${q.id}')">حذف</button>
      </div>
      <textarea rows="2" placeholder="اكتب نص السؤال..." oninput="updateHomeworkQuestion('${q.id}','text',this.value)" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px">${esc(q.text)}</textarea>
      ${q.type==='mcq'?`
        <div style="margin-top:10px;padding:10px;border-radius:11px;background:#f4f9ff;border:1px solid #dbeafe">
          <div style="font-size:12px;font-weight:900;color:#1769aa;margin-bottom:8px">✅ اكتب الخيارات ثم اختر الإجابة الصحيحة:</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            ${q.options.map((op,oi)=>`<label style="display:flex;align-items:center;gap:7px;padding:7px;border-radius:9px;background:${Number(q.correct)===oi?'#e8fff5':'#fff'};border:1px solid ${Number(q.correct)===oi?'#b8ead7':'var(--line)'}">
              <input type="radio" name="correct_${q.id}" value="${oi}" ${Number(q.correct)===oi?'checked':''} onchange="updateHomeworkQuestion('${q.id}','correct',this.value);renderHomeworkQuestionBuilder()">
              <input value="${esc(op)}" placeholder="الخيار ${oi+1}" oninput="updateHomeworkQuestion('${q.id}','option',this.value,${oi})" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:9px">
              ${Number(q.correct)===oi?'<span style="font-size:11px;color:#178a5b;font-weight:900;white-space:nowrap">الصحيح</span>':''}
            </label>`).join('')}
          </div>
        </div>`:''}
      <label style="display:block;margin-top:10px;font-size:12px;color:var(--muted)">درجة السؤال
        <input type="number" min="1" value="${q.points||1}" oninput="updateHomeworkQuestion('${q.id}','points',this.value)" style="width:80px;margin-right:8px;padding:7px;border:1px solid var(--line);border-radius:8px">
      </label>
    </div>`).join('');
}

async function publishSmartHomework(){
  if(role!=='teacher'){alert('هذا الخيار متاح للمعلم فقط.');return;}
  const title=document.getElementById('hwTitle')?.value.trim()||'';
  const description=document.getElementById('hwDesc')?.value.trim()||'';
  const grade=document.getElementById('hwGrade')?.value||'';
  const section=document.getElementById('hwSection')?.value||'';
  const due=document.getElementById('hwDue')?.value||'';
  const mode=document.getElementById('hwMode')?.value||'online';
  const status=document.getElementById('hwPublishStatus');
  if(!title){alert('اكتب عنوان الواجب.');return;}
  if(!due){alert('حدد موعد التسليم.');return;}

  let questions=[];
  let attachment=null;
  if(mode==='online'){
    questions=homeworkQuestionDraft.map(q=>({...q,text:String(q.text||'').trim(),options:(q.options||[]).map(x=>String(x||'').trim())}));
    if(!questions.length){alert('أضف سؤالًا واحدًا على الأقل.');return;}
    for(const q of questions){
      if(!q.text){alert('يوجد سؤال بدون نص.');return;}
      if(q.type==='mcq' && q.options.some(x=>!x)){alert('أكمل جميع خيارات أسئلة الاختيار المتعدد.');return;}
      if(q.type==='mcq' && (q.correct===null || q.correct===undefined || !q.options[Number(q.correct)])){alert('حدد الإجابة الصحيحة لكل سؤال اختيار متعدد.');return;}
    }
  }else{
    const file=document.getElementById('hwFile')?.files?.[0]||null;
    if(file){
      if(status) status.textContent='جاري رفع الملف...';
      attachment=await NabdCloud.uploadSchoolFile(file,'homeworks');
    }
  }

  try{
    if(status) status.textContent='جاري النشر في السحابة...';
    const teacher=demoData.teachers.find(x=>String(x.email||'').toLowerCase()===String(currentLoginEmail||'').toLowerCase());
    await NabdCloud.createInteractiveHomework({
      teacher_name:teacher?.name||'معلم',
      title,description,grade,section,due_at:due,questions,mode,attachment,
      max_score:questions.reduce((s,q)=>s+(Number(q.points)||1),0)
    });
    homeworkQuestionDraft=[];
    if(document.getElementById('hwTitle')) document.getElementById('hwTitle').value='';
    if(document.getElementById('hwDesc')) document.getElementById('hwDesc').value='';
    if(document.getElementById('hwFile')) document.getElementById('hwFile').value='';
    renderHomeworkQuestionBuilder();
    if(status){status.style.color='#178a5b';status.textContent='✓ تم نشر الواجب سحابيًا.';}
    await loadTeacherInteractiveHomeworks();
  }catch(e){
    if(status){status.style.color='#c0392b';status.textContent='تعذر النشر: '+(e.message||'');}
    alert('تعذر نشر الواجب: '+(e.message||''));
  }
}

function formatHomeworkDue(v){
  if(!v)return 'بدون موعد';
  const d=new Date(v);
  return Number.isNaN(d.getTime())?'—':d.toLocaleString('ar-OM',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

async function loadTeacherInteractiveHomeworks(){
  if(role!=='teacher')return;
  const box=document.getElementById('teacherInteractiveHomeworkList'); if(!box)return;
  try{
    const user=await NabdCloud.currentUser();
    const all=await NabdCloud.listInteractiveHomeworks();

    if(!list.length){
      box.innerHTML='<div style="text-align:center;color:var(--muted);padding:22px">لم تنشر واجبات سحابية بعد.</div>';
      return;
    }
    const cards=[];
    for(const h of list){
      let subs=[],classStudents=[];
      try{subs=await NabdCloud.teacherHomeworkSubmissions(h.id);}catch(e){}
      try{classStudents=await NabdCloud.listClassStudents(h.grade,h.section);}catch(e){}
      const submittedIds=new Set(subs.map(s=>String(s.student_id)));
      const notSubmitted=classStudents.filter(s=>!submittedIds.has(String(s.auth_user_id)));

      cards.push(`<div style="padding:16px 0;border-bottom:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
          <div><strong>${esc(h.title)}</strong><small style="display:block;color:var(--muted);margin-top:4px">${esc(h.grade)} / ${esc(h.section)} • التسليم ${formatHomeworkDue(h.due_at)} • ${h.mode==='online'?'داخل المنصة':'ملف مرفق'}</small></div>
          <div style="display:flex;gap:7px;flex-wrap:wrap">
            <span class="tag green">✅ سلّموا: ${subs.length}</span>
            <span class="tag orange">⏳ لم يسلّموا: ${notSubmitted.length}</span>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
          <details open style="border:1px solid #d8eee4;border-radius:12px;padding:10px;background:#fbfffd">
            <summary style="cursor:pointer;font-weight:900;color:#178a5b">✅ الطلاب الذين سلّموا (${subs.length})</summary>
            <div style="margin-top:10px">${subs.length?subs.map(s=>renderTeacherSubmission(h,s)).join(''):'<div style="color:var(--muted);padding:10px">لا توجد تسليمات حتى الآن.</div>'}</div>
          </details>
          <details style="border:1px solid #f2dfc6;border-radius:12px;padding:10px;background:#fffdfa">
            <summary style="cursor:pointer;font-weight:900;color:#b66a15">⏳ الطلاب الذين لم يسلّموا (${notSubmitted.length})</summary>
            <div style="margin-top:10px">${notSubmitted.length?notSubmitted.map((s,i)=>`<div style="padding:9px;border-bottom:1px dashed var(--line)">${esc(s.name||'طالب')} <small style="color:var(--muted)">• ${esc(s.grade||'')} / ${esc(s.section||'')}</small></div>`).join(''):'<div style="color:#178a5b;padding:10px;font-weight:800">جميع الطلاب سلّموا الواجب 🎉</div>'}</div>
          </details>
        </div>
      </div>`);
    }
    box.innerHTML=cards.join('');
  }catch(e){
    box.innerHTML='<div style="color:#c0392b;padding:16px">تعذر تحميل الواجبات: '+esc(e.message||'')+'</div>';
  }
}

function renderTeacherSubmission(hw,s){
  const answers=s.answers||{};
  const autoScore=Number(s.auto_score??0);
  const maxScore=Number(s.max_score??hw.max_score??0);
  const hasEssay=(hw.questions||[]).some(q=>q.type==='essay');
  const visible=!!s.score_visible;
  return `<div style="border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;background:#fff">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap">
      <div><strong>${esc(s.student_name||'طالب')}</strong><small style="display:block;color:var(--muted);margin-top:4px">تم التسليم: ${formatHomeworkDue(s.submitted_at)}</small></div>
      <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
        <span class="tag blue">التصحيح الآلي: ${autoScore}/${maxScore}</span>
        <span class="tag ${visible?'green':'orange'}">${visible?'الدرجة ظاهرة للطالب':'الدرجة مخفية عن الطالب'}</span>
      </div>
    </div>
    ${(hw.questions||[]).map((q,i)=>{
      const a=answers[q.id]??'';
      if(q.type==='mcq'){
        const correct=(q.options||[])[Number(q.correct)]??'';
        const ok=String(a)===String(correct);
        return `<div style="padding:9px 0;border-top:1px dashed var(--line)">
          <b>${i+1}. ${esc(q.text)}</b>
          <div style="margin-top:5px">إجابة الطالب: <strong style="color:${ok?'#178a5b':'#c0392b'}">${esc(a||'—')} ${ok?'✓':'✗'}</strong></div>
          <div style="font-size:12px;color:#178a5b;margin-top:3px">الإجابة الصحيحة: ${esc(correct)} • ${Number(q.points)||1} درجة</div>
        </div>`;
      }
      return `<div style="padding:9px 0;border-top:1px dashed var(--line)">
        <b>${i+1}. ${esc(q.text)}</b>
        <div style="margin-top:5px">إجابة الطالب: ${esc(a||'—')}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px">سؤال مقالي — يحتاج مراجعة المعلم • ${Number(q.points)||1} درجة</div>
      </div>`;
    }).join('')}
    <div style="display:grid;grid-template-columns:130px 1fr auto auto;gap:8px;align-items:end;margin-top:11px">
      <label style="font-size:12px">الدرجة النهائية
        <input id="grade_${s.id}" type="number" min="0" max="${maxScore||100}" value="${s.score??autoScore}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px">
      </label>
      <label style="font-size:12px">ملاحظة المعلم
        <input id="feedback_${s.id}" value="${esc(s.feedback||'')}" placeholder="${hasEssay?'راجع السؤال المقالي ثم عدّل الدرجة عند الحاجة':'ملاحظة اختيارية'}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px">
      </label>
      <button class="btn soft" onclick="saveSubmissionGrade(${s.id},${hw.id})">💾 حفظ</button>
      <button class="btn ${visible?'soft':'primary'}" onclick="toggleSubmissionGradeVisibility(${s.id},${visible?'false':'true'})">${visible?'🙈 إخفاء الدرجة':'📤 إرسال الدرجة للطالب'}</button>
    </div>
  </div>`;
}

async function saveSubmissionGrade(submissionId,homeworkId){
  const score=document.getElementById('grade_'+submissionId)?.value??'';
  const feedback=document.getElementById('feedback_'+submissionId)?.value||'';
  try{
    await NabdCloud.gradeHomeworkSubmission(submissionId,score,feedback);
    alert('تم حفظ الدرجة وملاحظة المعلم. لن تظهر للطالب حتى تضغط إرسال الدرجة.');
    await loadTeacherInteractiveHomeworks();
  }catch(e){alert('تعذر حفظ التصحيح: '+(e.message||''));}
}

async function toggleSubmissionGradeVisibility(submissionId,visible){
  try{
    await NabdCloud.setHomeworkScoreVisibility(submissionId,visible);
    alert(visible?'تم إرسال الدرجة للطالب وأصبحت ظاهرة في حسابه.':'تم إخفاء الدرجة عن الطالب.');

  }catch(e){alert('تعذر تحديث ظهور الدرجة: '+(e.message||''));}
}

function renderStudentQuestion(homeworkId,q,i){
  if(q.type==='mcq'){
    return `<div style="padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px">
      <strong>${i+1}. ${esc(q.text)}</strong>

    </div>`;

async function submitOnlineHomework(homeworkId){
  try{
    const all=await NabdCloud.listInteractiveHomeworks();
    const hw=all.find(x=>Number(x.id)===Number(homeworkId)); if(!hw)return;
    const answers={};
    for(const q of (hw.questions||[])){
      if(q.type==='mcq'){
        const checked=document.querySelector(`input[name="ans_${homeworkId}_${q.id}"]:checked`);
        if(!checked){alert('أجب عن جميع الأسئلة قبل الإرسال.');return;}
        answers[q.id]=checked.value;
      }else{
        const val=document.getElementById(`ans_${homeworkId}_${q.id}`)?.value.trim()||'';
        if(!val){alert('أجب عن جميع الأسئلة قبل الإرسال.');return;}
        answers[q.id]=val;
      }
    }
    const student=currentStudentProfile();
    await NabdCloud.submitInteractiveHomework(homeworkId,answers,student?.name||'طالب');
    alert('تم إرسال إجاباتك للمعلم بنجاح.');
    await loadStudentInteractiveHomeworks();
  }catch(e){alert('تعذر إرسال الواجب: '+(e.message||''));}
}

function allGrades(){
  return demoData.stages.flatMap(s=>s.grades.map(g=>({stage:s.name,grade:g})));
}

function canonicalGrade(value){
  return String(value||'')
    .replace(/\s*\([أبجدهـ]\)\s*$/,'')
    .replace(/\s*[-–—]\s*الشعبة\s*\([^)]+\)\s*$/,'')
    .trim();
}

function normalizeStudentAcademicData(){
  let changed=false;
  demoData.students.forEach(s=>{
    const fixedGrade=canonicalGrade(s.grade);
    if(fixedGrade && fixedGrade!==s.grade){
      s.grade=fixedGrade;
      changed=true;
    }
    if(!s.stage && fixedGrade){
      const match=allGrades().find(x=>canonicalGrade(x.grade)===fixedGrade);
      if(match){ s.stage=match.stage; changed=true; }
    }
  });
  if(changed) saveDemoData();
}
normalizeStudentAcademicData();

async function saveStudentCredentialsAdmin(id){
  if(role!=='admin'){ alert('هذا الخيار متاح للإدارة فقط.'); return; }
  const s=demoData.students.find(x=>x.id===id); if(!s)return;
  const email=(document.getElementById('adminStudentEmail_'+id)?.value||'').trim().toLowerCase();
  const password=(document.getElementById('adminStudentPassword_'+id)?.value||'').trim();
  if(!email){alert('البريد الإلكتروني مطلوب.');return;}
  if(!password){alert('اكتب كلمة مرور جديدة للحساب.');return;}
  const emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!emailPattern.test(email)){alert('صيغة البريد الإلكتروني غير صحيحة.');return;}
  try{
    await NabdCloud.updateUser({...s,role:'student',email},password);
    await syncCloudProfiles(); renderAdminManagement();
    alert('✓ تم تحديث بيانات دخول الطالب في Supabase.');
  }catch(e){alert('تعذر تحديث الحساب: '+(e.message||''));}
}

function filterStudentCredentials(){
  const name=(document.getElementById('credentialNameSearch')?.value || '').trim().toLowerCase();
  const grade=document.getElementById('credentialGradeFilter')?.value || 'الكل';
  const section=document.getElementById('credentialSectionFilter')?.value || 'الكل';
  let list=demoData.students.filter(s=>{
    const matchesName=!name || (s.name||'').toLowerCase().includes(name);
    const matchesGrade=grade==='الكل' || canonicalGrade(s.grade)===canonicalGrade(grade);
    const matchesSection=section==='الكل' || s.section===section;
    return matchesName && matchesGrade && matchesSection;
  });
  const body=document.getElementById('studentCredentialsBody');
  const count=document.getElementById('credentialCount');
  if(body) body.innerHTML=renderStudentCredentialsRows(list);
  if(count) count.textContent=`عدد الحسابات: ${list.length}`;
}

let editingStudentId=null;


function validateStudentPhoneField(){
  const input=document.getElementById('newStudentPhone');
  const error=document.getElementById('newStudentPhoneError');
  if(!input) return false;

  // Allow digits only and limit to exactly 8.
  input.value=input.value.replace(/\D/g,'').slice(0,8);
  const value=input.value.trim();

  input.classList.remove('field-invalid','field-valid');
  if(!value){
    if(error) error.textContent='رقم الهاتف مطلوب.';
    input.classList.add('field-invalid');
    return false;
  }
  if(!/^\d{8}$/.test(value)){
    if(error) error.textContent='⚠️ رقم الهاتف يجب أن يتكون من 8 أرقام بالضبط.';
    input.classList.add('field-invalid');
    return false;
  }

  if(error) error.textContent='';
  input.classList.add('field-valid');
  return true;
}

function validateStudentEmailField(){
  const input=document.getElementById('newStudentEmail');
  const error=document.getElementById('newStudentEmailError');
  if(!input) return false;

  const value=input.value.trim().toLowerCase();
  input.classList.remove('field-invalid','field-valid');

  if(!value){
    if(error) error.textContent='البريد الإلكتروني مطلوب.';
    input.classList.add('field-invalid');
    return false;
  }

  const emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  if(!emailPattern.test(value)){
    if(error) error.textContent='⚠️ البريد الإلكتروني غير صحيح. مثال: name@gmail.com';
    input.classList.add('field-invalid');
    return false;
  }

  const duplicate=demoData.students.some(x=>
    x.id!==editingStudentId &&
    String(x.email||'').trim().toLowerCase()===value
  );
  if(duplicate){
    if(error) error.textContent='⚠️ هذا البريد الإلكتروني مستخدم لطالب آخر.';
    input.classList.add('field-invalid');
    return false;
  }

  if(error) error.textContent='';
  input.classList.add('field-valid');
  return true;
}

let editingTeacherId=null;
function validateTeacherPhoneField(){
  const input=document.getElementById('newTeacherPhone');
  const error=document.getElementById('newTeacherPhoneError');
  if(!input) return false;

  input.value=input.value.replace(/\D/g,'').slice(0,8);
  const value=input.value.trim();
  input.classList.remove('field-invalid','field-valid');

  if(!value){
    if(error) error.textContent='رقم الهاتف مطلوب.';
    input.classList.add('field-invalid');
    return false;
  }
  if(!/^\d{8}$/.test(value)){
    if(error) error.textContent='⚠️ رقم الهاتف يجب أن يتكون من 8 أرقام بالضبط.';
    input.classList.add('field-invalid');
    return false;
  }

  if(error) error.textContent='';
  input.classList.add('field-valid');
  return true;
}

function validateTeacherEmailField(){
  const input=document.getElementById('newTeacherEmail');
  const error=document.getElementById('newTeacherEmailError');
  if(!input) return false;

  const value=input.value.trim().toLowerCase();
  input.classList.remove('field-invalid','field-valid');

  if(!value){
    if(error) error.textContent='البريد الإلكتروني مطلوب.';
    input.classList.add('field-invalid');
    return false;
  }

  const emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  if(!emailPattern.test(value)){
    if(error) error.textContent='⚠️ البريد الإلكتروني غير صحيح. مثال: name@gmail.com';
    input.classList.add('field-invalid');
    return false;
  }

  const duplicateTeacher=demoData.teachers.some(x=>
    x.id!==editingTeacherId && String(x.email||'').trim().toLowerCase()===value
  );
  const duplicateStudent=demoData.students.some(x=>
    String(x.email||'').trim().toLowerCase()===value
  );

  if(duplicateTeacher || duplicateStudent){
    if(error) error.textContent='⚠️ هذا البريد الإلكتروني مستخدم في حساب آخر.';
    input.classList.add('field-invalid');
    return false;
  }

  if(error) error.textContent='';
  input.classList.add('field-valid');
  return true;
}

}
